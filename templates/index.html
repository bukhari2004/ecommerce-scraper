<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraStyle | Modern Clothing Storefront</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --card-bg: #ffffff;
      --card-hover: #ffffff;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-glow: rgba(37, 99, 235, 0.12);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --badge-border: #bfdbfe;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    header {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      color: var(--text-main);
      border-color: var(--text-subtle);
    }

    /* Hero & Search Section */
    .hero {
      max-width: 1280px;
      margin: 0 auto;
      padding: 48px 24px 28px;
      width: 100%;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .search-wrapper {
      position: relative;
      max-width: 680px;
    }

    .search-form {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }

    .search-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 1rem;
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--text-subtle);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    /* Quick Tags */
    .quick-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .quick-tags span {
      font-size: 0.82rem;
      color: var(--text-subtle);
    }

    .tag-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tag-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--badge-bg);
    }

    /* Status Bar */
    .status-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 16px;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
    }

    .status-count {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Product Grid */
    main {
      flex: 1;
      max-width: 1280px;
      margin: 0 auto 60px;
      padding: 0 24px;
      width: 100%;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: #cbd5e1;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 280px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .card-img {
      transform: scale(1.05);
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--badge-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 12px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      margin-top: auto;
    }

    .price-container {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.7rem;
      color: var(--text-subtle);
      text-transform: uppercase;
    }

    .price-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .view-link {
      background: #f8fafc;
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .view-link:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 70px 20px;
      background: var(--bg-secondary);
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 44px;
      height: 44px;
      margin-bottom: 16px;
      stroke: var(--text-subtle);
    }

    .empty-state h3 {
      color: var(--text-main);
      font-size: 1.15rem;
      margin-bottom: 6px;
    }

    /* Skeleton Loading Cards */
    .skeleton-card {
      background: #e2e8f0;
      border-radius: 12px;
      height: 380px;
      animation: pulse 1.5s infinite ease-in-out;
      border: 1px solid var(--border-color);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span>AuraStyle</span>
      </a>
      <div class="nav-actions">
        <a href="/download/csv" class="btn-secondary" title="Download latest scraped CSV">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export CSV
        </a>
        <a href="/download/excel" class="btn-secondary" title="Download latest scraped Excel file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export Excel
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="hero">
    <h1 class="hero-title">Discover the Catalog</h1>
    <p class="hero-desc">Real-time clothing intelligence powered by AutomationExercise API.</p>

    <div class="search-wrapper">
      <div class="search-form">
        <input 
          type="text" 
          id="queryInput" 
          class="search-input" 
          placeholder="Search items by keyword (e.g. dress, tshirt, jeans, top)..." 
          autofocus 
        />
        <button id="searchBtn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          Search
        </button>
      </div>

      <div class="quick-tags">
        <span>Suggested:</span>
        <button class="tag-btn" onclick="quickSearch('dress')">Dress</button>
        <button class="tag-btn" onclick="quickSearch('tshirt')">T-shirt</button>
        <button class="tag-btn" onclick="quickSearch('jeans')">Jeans</button>
        <button class="tag-btn" onclick="quickSearch('top')">Top</button>
        <button class="tag-btn" onclick="quickSearch('saree')">Saree</button>
      </div>
    </div>
  </section>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <span id="statusMessage">Enter a search query to load products.</span>
  </div>

  <!-- Main Product Display -->
  <main>
    <div id="productGrid" class="product-grid">
      <div class="empty-state" style="grid-column: 1 / -1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
        </svg>
        <h3>Ready to Explore</h3>
        <p>Use the search field above or choose a suggested tag to query live clothing items.</p>
      </div>
    </div>
  </main>

  <script>
    const queryInput = document.getElementById('queryInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusMessage = document.getElementById('statusMessage');
    const grid = document.getElementById('productGrid');

    function quickSearch(tag) {
      queryInput.value = tag;
      runSearch();
    }

    async function runSearch() {
      const q = queryInput.value.trim();
      if (!q) {
        statusMessage.textContent = 'Please enter a search term.';
        return;
      }

      statusMessage.textContent = `Searching catalog for "${q}"...`;
      grid.innerHTML = Array(4).fill('<div class="skeleton-card"></div>').join('');

      const formData = new FormData();
      formData.append('query', q);

      try {
        const res = await fetch('/search', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.status !== 'success') {
          statusMessage.textContent = 'Search failed. Please try again.';
          renderEmpty('Error loading results', 'Could not query the catalog backend.');
          return;
        }

        if (data.count === 0) {
          statusMessage.textContent = `No items found matching "${q}".`;
          renderEmpty('No Products Found', 'Try another search query or check spelling.');
          return;
        }

        statusMessage.innerHTML = `Showing <span class="status-count">${data.count}</span> results for "${q}"`;

        grid.innerHTML = data.products.map(p => `
          <div class="product-card">
            <div class="card-img-wrapper">
              <span class="card-badge">${escapeHtml(p.target || 'General')}</span>
              <img 
                class="card-img" 
                src="${p.image}" 
                alt="${escapeHtml(p.name)}" 
                loading="lazy" 
                onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%25%22 height=%22100%25%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2394a3b8%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect width=%2218%22 height=%2218%22 x=%223%22 y=%223%22 rx=%222%22 ry=%222%22/><circle cx=%229%22 cy=%229%22 r=%222%22/><path d=%22m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21%22/></svg>';" 
              />
            </div>
            <div class="card-body">
              <div class="card-meta">
                <span>${escapeHtml(p.brand || 'Unbranded')}</span>
                <span>${escapeHtml(p.category || 'Apparel')}</span>
              </div>
              <h4 class="card-title">${escapeHtml(p.name)}</h4>
              <div class="card-footer">
                <div class="price-container">
                  <span class="price-label">Price</span>
                  <span class="price-value">Rs. ${p.price}</span>
                </div>
                <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="view-link">
                  Details
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7" y1="17" x2="17" y2="7"></line>
                    <polyline points="7 7 17 7 17 17"></polyline>
                  </svg>
                </a>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        statusMessage.textContent = 'Server connection error: ' + err.message;
        renderEmpty('Connection Failed', 'Ensure app.py is running at http://127.0.0.1:5000');
      }
    }

    function renderEmpty(heading, description) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h3>${heading}</h3>
          <p>${description}</p>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    searchBtn.addEventListener('click', runSearch);
    queryInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') runSearch();
    });
  </script>
</body>
</html>
